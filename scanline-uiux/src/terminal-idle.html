<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>状态矩阵 · 空闲 — HTML 轨</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<style>.tabstrip{left:48px}.inputzone{top:74px;left:48px;right:0}.stream{top:140px;left:48px;right:0}</style>
<script src="assets/theme.js"></script><script src="assets/icons.js"></script>
</head>
<body>
<div class="stagewin">
  <div class="captionbar"><span class="cap-glyph">❯</span><span class="cap-name">Scanline</span>
    <span class="capbtns"><span class="capbtn">─</span><span class="capbtn">□</span><span class="capbtn">✕</span></span></div>
  <div class="actbar">
    <span class="ab on"><svg data-symbol="terminal" data-size="20"></svg></span>
    <span class="ab"><svg data-symbol="archivebox" data-size="20"></svg></span>
    <span class="ab"><svg data-symbol="sliders" data-size="20"></svg></span></div>
  <div class="tabstrip">
    <span class="wtab on"><span class="sdot"></span>dev</span>
    <span class="sbtn"><svg data-symbol="plus" data-size="17"></svg></span>
    <span class="grow"></span><span class="sbtn"><svg data-symbol="split" data-size="17"></svg></span>
    <span class="chip">Ctrl + K</span></div>
  <div class="inputzone">
    <span class="chip" style="background:var(--c-brand-tint);color:var(--c-brand)">NL</span>
    <span class="bigfield" style="color:var(--ink-3)">输入命令,或用自然语言描述想做的事…</span>
    <span class="send" style="width:36px;height:36px;font-size:16px">↑</span></div>
  <div class="stream">
    <div class="tline"><span class="prompt">~/dev ❯</span> <span class="cursor"></span></div>
  </div>
  <div class="statusbar"><span>~/dev</span><span> main</span><span>输入延迟 12ms</span><span>BYOK:本地 Ollama ✓</span>
    <span class="grow"></span><span>Phosphor CRT</span></div>
  <span class="pin" style="top:200px;left:400px">1</span>
  <span class="pin" style="top:92px;left:600px">2</span>
  <span class="pin" style="top:46px;left:300px">3</span>
</div>
<div class="panel wide">
  <h4>状态 · 空闲(idle)—— 终端视图状态矩阵</h4>
  <ol>
    <li><b>①</b><span>空闲 = 仅提示符 + 光标;连接保持、PTY 存活——空闲不是断线(对照 terminal-disconnect)</span></li>
    <li><b>②</b><span>输入区占位文案引导两种输入方式(命令 / NL);NL 标签常驻</span></li>
    <li><b>③</b><span>标签条 / 活动栏 / 状态栏与基准态一致(骨架不变,只变内容)</span></li>
  </ol>
</div>
</body>
</html>
